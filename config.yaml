project:
  name: Industraial-Defect-Detection
  random_state: 42

dataset:
  path: data/NEU-DET
  images_size: 244
  grid_size: 7
  batch_size: 16
  train_split: 0.80

model:
  architecture : MobileNetV2
  Pretrained: True
  num_classes: 6

training:
  epochs: 30
  learning_rate: 0.0001
  early_stopping : 6

evaluation:
  confidence_threshold: 0.25
  iou_threshold: 0.50