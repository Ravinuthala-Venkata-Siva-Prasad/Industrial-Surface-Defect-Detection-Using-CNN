
services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: defect-detection-backend

    ports:
      - "8000:8000"

    environment:
      TF_CPP_MIN_LOG_LEVEL: "2"
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./outputs:/app/outputs

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: defect-detection-frontend

    ports:
      - "8501:8501"

    environment:
      API_URL: "http://backend:8000"

    depends_on:
      - backend

    restart: unless-stopped
