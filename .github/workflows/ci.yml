
name: Industrial Defect Detection - CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI server
        run: |
          mkdir -p outputs/api_uploads
          nohup uvicorn app.api:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &

      - name: Wait for API health check
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "API is ready"
              exit 0
            fi
            sleep 5
          done

          echo "API failed to start"
          cat api.log
          exit 1

      - name: Run tests
        run: |
          pytest -v

      - name: Display API logs if tests fail
        if: failure()
        run: |
          cat api.log
